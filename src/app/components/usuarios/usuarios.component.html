<section class="contenedor-principal">
  <section class="contenedor-form">
    <h3>Registrar nuevo Usuario</h3>

    <!-- Enlazamos el grupo de datos y el evento de guardado -->
    <form [formGroup]="usuarioForm" (ngSubmit)="guardarUsuario()">

      <div class="contenedor-campos">
        <label for="username">Usuario</label>
        <!-- formControlName conecta este input con la variable exacta en el componente -->
        <input type="text" id="username" formControlName="username" placeholder="Ej. jperez">
      </div>

      <div class="contenedor-campos">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" placeholder="********">
      </div>

      <div class="contenedor-campos">
        <label for="rol">Rol</label>
        <select id="rol" formControlName="rol">
          <option value="CAJERO">Cajero</option>
          <option value="ADMIN">Administrador</option>
        </select>
      </div>

      <!-- El boton se bloquea  si faltan datos -->
      <button type="submit" class="btn-guardar" [disabled]="usuarioForm.invalid">Guardar</button>
    </form>

  </section>


  <section class="contenedor-usuarios">
    <!-- Iteramos el Signal con los usuarios y los mostramos -->
  @for (usuario of usuarios(); track usuario.id)
  {
    <article class="usuario-card">
      <div class="card-info">
        <h4>{{ usuario.username }}</h4>

        <h4>{{ usuario.activo }}</h4>

        @if (usuario.activo)
        {
          <span>Estado: Activo</span>
          <br>
        } @else {
          <span>Estado: Inactivo</span>
          <br>
        }
        <span class="badge-rol">Rol: {{ usuario.rol }}</span>
      </div>

      <div class="card-acciones">
        <button  class="btn-editar">Editar</button>
        <button (click)="suspenderUsuario( usuario.id )" class="btn-eliminar">Quitar acceso</button>
      </div>
    </article>
  }
  @empty
  {
    <div class="mensaje-vacio">
      <p>No hay usuarios registrados en el sistema.</p>
    </div>
  }
  </section>
</section>
