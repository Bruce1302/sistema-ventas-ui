<section class="contenedor-principal">
  <app-sidebar-menu class="sidebar"></app-sidebar-menu>

  <section class="contenedor-form">
    <app-form-usuarios></app-form-usuarios>
  </section>

  <section class="contenedor-usuarios">
    <!-- Iteramos el Signal con los usuarios y los mostramos -->
  @for (usuario of usuarios(); track usuario.id)
  {
    <article class="usuario-card">
      <div class="card-info">
        <h4>{{ usuario.username }}</h4>

        <h4>{{ usuario.activo }}</h4>

        @if (usuario.activo)
        {
          <span>Estado: Activo</span>
          <br>
        } @else {
          <span>Estado: Inactivo</span>
          <br>
        }
        <span class="badge-rol">Rol: {{ usuario.rol }}</span>
      </div>

      <div class="card-acciones">
        <button (click)="seleccionarUsuario(usuario)" class="btn-editar">Editar</button>
        <button (click)="suspenderUsuario( usuario.id )" class="btn-desactivar">Quitar acceso</button>
        <button (click)="destruirUsuario( usuario.id )" class="btn-eliminar">Eliminar</button>
      </div>

    </article>
  }
  @empty
  {
    <div class="mensaje-vacio">
      <p>No hay usuarios registrados en el sistema.</p>
    </div>
  }
  </section>
</section>
