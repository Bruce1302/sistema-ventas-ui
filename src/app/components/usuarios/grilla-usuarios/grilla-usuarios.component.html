<section class="contenedor-grillaUsuario">
  @for (usuario of usuarios(); track usuario.id)
  {
    <article class="usuario-card" [ngClass]="{'inactivo': !usuario.activo}">
      <div class="contenedor-icono">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g id="SVGRepo_tracurrentColorerCarrier" stroke-linecurrentcap="round" stroke-linejoin="round"></g>
          <g id="SVGRepo_icurrentColoronCarrier">
            <path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z" fill="currentColor"></path>
            <path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z" fill="currentColor"></path>
          </g>
        </svg>
      </div>

      <div class="card-texto">
        <h4 class="username">{{ usuario.username }}</h4>

        <p class="estado" [ngClass]="{'inactivo': !usuario.activo}"> {{ usuario.activo ? 'Activo' : 'Inactivo'}}</p>

        <p class="rol">{{ usuario.rol }}</p>
      </div>

      <div class="contenedor-acciones">
        <button (click)="seleccionarParaEdicion(usuario)" class="btn-editar" title="Editar usuario">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g id="SVGRepo_tracurrentcolorerCarrier" stroke-linecurrentcolorap="round" stroke-linejoin="round"></g>
            <g id="SVGRepo_icurrentcoloronCarrier">
              <path fill-rule="evenodd" currentcolorlip-rule="evenodd"
                    d="M20.8477 1.87868C19.6761 0.707109 17.7766 0.707105 16.605 1.87868L2.44744 16.0363C2.02864 16.4551 1.74317 16.9885 1.62702 17.5692L1.03995 20.5046C0.760062 21.904 1.9939 23.1379 3.39334 22.858L6.32868 22.2709C6.90945 22.1548 7.44285 21.8693 7.86165 21.4505L22.0192 7.29289C23.1908 6.12132 23.1908 4.22183 22.0192 3.05025L20.8477 1.87868ZM18.0192 3.29289C18.4098 2.90237 19.0429 2.90237 19.4335 3.29289L20.605 4.46447C20.9956 4.85499 20.9956 5.48815 20.605 5.87868L17.9334 8.55027L15.3477 5.96448L18.0192 3.29289ZM13.9334 7.3787L3.86165 17.4505C3.72205 17.5901 3.6269 17.7679 3.58818 17.9615L3.00111 20.8968L5.93645 20.3097C6.13004 20.271 6.30784 20.1759 6.44744 20.0363L16.5192 9.96448L13.9334 7.3787Z"
                    fill="currentcolor"></path>
            </g>
          </svg>
        </button>

        @if (usuario.activo)
        {
          <button (click)="suspenderUsuario( usuario.id )" class="btn-desactivar" title="Quitar acceso a usuario">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
              <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
              <g id="SVGRepo_iconCarrier">
                <circle cx="12" cy="6" r="4" stroke="currentColor" stroke-width="1.5"></circle>
                <path d="M19.9502 16.0498L16.0502 19.9497" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
                <circle cx="18" cy="18" r="3" stroke="currentColor" stroke-width="1.5"></circle>
                <path d="M13 20.9595C12.6734 20.9862 12.3395 21 12 21C8.13401 21 5 19.2091 5 17C5 16.6547 5.07657 16.3196 5.22053 16M14.5 13.2626C13.7236 13.093 12.8808 13 12 13C10.9264 13 9.90926 13.1381 9 13.3849" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
              </g>
            </svg>
          </button>
        }
        @else
        {
          <button (click)="activarUsuario( usuario.id )" class="btn-activar" title="Dar acceso a usuario">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
              <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
              <g id="SVGRepo_iconCarrier">
                <path d="M14 19.2857L15.8 21L20 17M4 21C4 17.134 7.13401 14 11 14C12.4872 14 13.8662 14.4638 15 15.2547M15 7C15 9.20914 13.2091 11 11 11C8.79086 11 7 9.20914 7 7C7 4.79086 8.79086 3 11 3C13.2091 3 15 4.79086 15 7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round"></path>
              </g>
            </svg>
          </button>
        }

        <button (click)="destruirUsuario( usuario.id )" class="btn-eliminar" title="Eliminar usuario permanentemente">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g id="SVGRepo_tracurrentColorerCarrier" stroke-linecurrentcap="round" stroke-linejoin="round"></g>
            <g id="SVGRepo_icurrentColoronCarrier">
              <path d="M10 11V17" stroke="currentColor" stroke-width="2" stroke-linecurrentcap="round" stroke-linejoin="round"></path>
              <path d="M14 11V17" stroke="currentColor" stroke-width="2" stroke-linecurrentcap="round" stroke-linejoin="round"></path>
              <path d="M4 7H20" stroke="currentColor" stroke-width="2" stroke-linecurrentcap="round" stroke-linejoin="round"></path>
              <path d="M6 7H12H18V18C18 19.6569 16.6569 21 15 21H9C7.34315 21 6 19.6569 6 18V7Z" stroke="currentColor" stroke-width="2" stroke-linecurrentcap="round" stroke-linejoin="round"></path>
              <path d="M9 5C9 3.89543 9.89543 3 11 3H13C14.1046 3 15 3.89543 15 5V7H9V5Z" stroke="currentColor" stroke-width="2" stroke-linecurrentcap="round" stroke-linejoin="round"></path>
            </g>
          </svg>
        </button>
      </div>

    </article>
  }
  @empty
  {
    <div class="mensaje-vacio">
      <p>No hay usuarios registrados en el sistema.</p>
    </div>
  }
</section>
