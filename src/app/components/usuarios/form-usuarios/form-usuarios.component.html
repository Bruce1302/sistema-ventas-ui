<form [formGroup]="usuarioForm" (ngSubmit)="guardarUsuario()">

  <div class="contenedor-campos">
    <label for="username">Usuario</label>
    <!-- formControlName conecta este input con la variable exacta en el componente -->
    <input type="text" id="username" formControlName="username" placeholder="Ej. jperez">
  </div>

  <div class="contenedor-campos">
    <label for="password">Contraseña</label>
    <input type="password" id="password" formControlName="password" placeholder="********">
  </div>

  <div class="contenedor-campos">
    <label for="rol">Rol</label>
    <select id="rol" formControlName="rol">
      <option value="CAJERO">Cajero</option>
      <option value="ADMIN">Administrador</option>
    </select>
  </div>

  <!-- El boton se bloquea  si faltan datos -->
  <button type="submit" class="btn-guardar" [disabled]="usuarioForm.invalid">{{ this.usuarioService.usuarioSeleccionado() ? 'Actualizar' : 'Guardar' }}</button>

  @if (this.usuarioService.usuarioSeleccionado())
  {
    <button type="button" class="btn-cancelar" (click)="cancelarEdicion()">Cancelar</button>
  }

</form>
