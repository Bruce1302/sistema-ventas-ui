<div class="toast-contenedor" [class]="toast()?.tipo">

  <div class="toast-contenido">
          <span class="icono">
            {{ toast()?.tipo === 'exito' ? '✅' : '⚠️' }}
          </span>
    <p class="mensaje">{{ toast()?.mensaje }}</p>
    <button class="btn-cerrar" (click)="cerrarManual()">✖</button>
  </div>

  <div class="toast-barra"></div>
</div>
