<main class="main-contenedor">

  <section class="login-contenedor">
    <h2>Sistema de venta</h2>
    <p>Iniciar Sesión</p>

    <form>
      <div class="form-contenedor">
        <label for="username">Usuario:</label>
        <input type="text" id="username" name="username" [(ngModel)]="credenciales.username" placeholder="Ej. Administrador">
      </div>

      <div class="grupo-formulario">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" [(ngModel)]="credenciales.password" placeholder="********">
      </div>

      <button type="button" class="btn-ingresar" (click)="iniciarSesion()">Ingresar</button>
    </form>
  </section>

</main>
