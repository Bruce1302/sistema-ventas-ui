<section class="contenedor-principal">

  <h2>Sistema de venta</h2>
  <section class="login-contenedor">
    <h3>Iniciar Sesión</h3>

    <form (ngSubmit)="iniciarSesion()" class="form-contenedor">
      <div class="campos-contenedor">
        <label for="username">USUARIO</label>
        <input type="text" id="username" name="username" [(ngModel)]="credenciales.username" placeholder="Ejm. Administrador">
      </div>

      <div class="campos-contenedor">
        <label for="password">CONTRASEÑA</label>
        <input type="password" id="password" name="password" [(ngModel)]="credenciales.password" placeholder="**********">
      </div>

      <button type="submit" class="btn-ingresar">
        <svg viewBox="0 0 24 24" class="arr-2" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
          ></path>
        </svg>
        <span class="text">Iniciar Sesión</span>
        <span class="circle"></span>
        <svg viewBox="0 0 24 24" class="arr-1" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
          ></path>
        </svg>
      </button>

    </form>
  </section>

</section>
