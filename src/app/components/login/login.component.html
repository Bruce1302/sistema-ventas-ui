<section class="contenedor-principal">

  <section class="login-contenedor">
    <h3>Iniciar Sesión</h3>

    <form (ngSubmit)="iniciarSesion()" [formGroup]="loginForm" class="form-contenedor">
      <div class="campos-contenedor">
        <!--label for="codigoTienda">CÓDIGO DE TIENDA</label-->
        <input type="text" id="codigoTienda" formControlName="codigoTienda" name="codigoTienda" placeholder="Código de tienda">
      </div>

      <div class="campos-contenedor">
        <!--label for="username">USUARIO</label-->
        <input type="text" id="username" formControlName="username" name="username" placeholder="Usuario">
      </div>

      <div class="campos-contenedor">
        <!--label for="password">CONTRASEÑA</label-->
        <input type="password" id="password" formControlName="password" name="password" placeholder="Contraseña">
      </div>

      <button type="submit" class="btn-ingresar" [disabled]=" loginForm.invalid || logueando()" [ngClass]="{'desactivado': logueando()}">
        <svg viewBox="0 0 24 24" class="arr-2" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
          ></path>
        </svg>
        <span class="text">Iniciar Sesión</span>
        <span class="circle"></span>
        <svg viewBox="0 0 24 24" class="arr-1" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
          ></path>
        </svg>
      </button>

    </form>
  </section>

</section>
