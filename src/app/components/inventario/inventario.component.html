<section>

  <section class="sidebar">
    <app-sidebar-menu></app-sidebar-menu>
  </section>

  <section class="contenedor-formProductos">
    <app-form-producto></app-form-producto>
  </section>

  <section class="contenedor-grillaProductos">
    <app-grilla-productos></app-grilla-productos>
  </section>

  <section class="contenedor-formCategorias">
    <app-form-categoria></app-form-categoria>
  </section>

  <section>
    <h3>Lista de Categorías</h3>
    @for (categoria of listaCategorias(); track categoria.id)
    {
      <h3>{{ categoria.nombre }}</h3>
      <h3>{{ categoria.id}}</h3>
      <button (click)="eliminarCategoria( categoria.id )">Eliminar</button>
      <button>Editar</button>

    }
  </section>

</section>
